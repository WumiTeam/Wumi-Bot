<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wumi · Vérification</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="fond" aria-hidden="true"></div>

  <main class="carte" id="app" aria-live="polite">
    <header class="entete">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 120 80" width="58" height="38">
          <polyline points="14,14 26,56 44,32 62,56 74,14" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="100" cy="58" r="10" fill="#fff"/>
        </svg>
      </div>
      <div>
        <p class="etiquette" id="etiquette">VÉRIFICATION</p>
        <h1 id="titre">Wumi</h1>
      </div>
    </header>

    <!-- Chargement -->
    <section class="etape" id="etape-chargement">
      <div class="roue" aria-hidden="true"></div>
      <p class="discret" id="texte-chargement">Connexion à Discord…</p>
    </section>

    <!-- Reglement -->
    <section class="etape cachee" id="etape-regles">
      <div class="membre" id="membre"></div>
      <h2 id="regles-titre"></h2>
      <ol class="regles" id="regles"></ol>
      <label class="case">
        <input type="checkbox" id="accepter">
        <span id="regles-accepter"></span>
      </label>
      <button class="bouton" id="continuer" disabled></button>
    </section>

    <!-- Defi -->
    <section class="etape cachee" id="etape-defi">
      <h2 id="defi-titre"></h2>
      <p class="consigne" id="defi-texte"></p>
      <div class="grille" id="grille" role="group"></div>
      <p class="message" id="defi-message" role="alert"></p>
    </section>

    <!-- Reussite -->
    <section class="etape cachee" id="etape-reussi">
      <div class="coche" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
      </div>
      <h2 id="reussi-titre"></h2>
      <p id="reussi-texte"></p>
      <button class="bouton" id="fermer"></button>
    </section>

    <!-- Erreur -->
    <section class="etape cachee" id="etape-erreur">
      <h2 id="erreur-titre">Oups</h2>
      <p id="erreur-texte"></p>
      <button class="bouton secondaire" id="reessayer">Réessayer</button>
    </section>

    <footer class="pied">wumi<span>.</span></footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
